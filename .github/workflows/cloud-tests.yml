name: Cloud backend tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'cloud/**'
      - 'tests/test_cloud_server.py'
      - '.github/workflows/cloud-tests.yml'
  pull_request:
    paths:
      - 'cloud/**'
      - 'tests/test_cloud_server.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q cloud
      - run: python -m unittest discover -s tests -p 'test_cloud_server.py' -v
